name: Site maintenance

# Keeps content integrity, on-page SEO, disclosures, the share card and the
# sitemap correct without anyone remembering to do it. Runs on every push to
# main that touches site content, and can be run by hand from the Actions tab.
#
# Every step writes to the run summary, which is readable on the run page
# without signing in — the logs are not.

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "*.html"
      - "tools/**"
      - ".github/workflows/site-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet Pillow
          echo "### deps installed" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the social share card
        run: |
          python3 tools/make_og_card.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Content integrity
        run: |
          echo '### integrity' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/integrity.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Retrofit on-page SEO
        run: |
          echo '### retrofit' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/seo_retrofit.py | tail -5 >> "$GITHUB_STEP_SUMMARY"

      - name: Keep disclosures truthful
        run: |
          echo '### disclosures' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/fix_disclosures.py | tail -3 >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the sitemap
        run: |
          python3 tools/build_sitemap.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '### files changed' >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain | wc -l >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit — site already consistent" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -A
          git commit -q -m "chore: integrity, canonical, share card, schema, disclosures and sitemap upkeep [skip ci]"
          if git push 2>> "$GITHUB_STEP_SUMMARY"; then
            echo "pushed OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PUSH FAILED — check Settings > Actions > General > Workflow permissions" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The gate. Runs last, so the labelling and the docs are already committed,
      # then turns the build RED if a post shipped a first-hand claim it cannot
      # back, or if a placeholder token is live. This is what stops a future
      # session quietly publishing another invented experiment.
      - name: Evidence gate
        run: |
          echo '### evidence gate' >> "$GITHUB_STEP_SUMMARY"
          set +e
          python3 tools/integrity.py --check --enforce > /tmp/gate.txt
          status=$?
          set -e
          tail -4 /tmp/gate.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo 'GATE FAILED — see EVIDENCE.md at the repo root' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'gate passed' >> "$GITHUB_STEP_SUMMARY"
